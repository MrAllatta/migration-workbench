version: "1.3"
source:
  provider: local
  source_id: import_pipeline_e2e

tables:
  - suggested_model_name: ExampleFarm
    bundle_worksheet_title: Farms
    columns:
      - name: name
        class: CharField
        kwargs: { max_length: 200, unique: true }
      - name: region
        class: CharField
        kwargs: { max_length: 100, blank: true, default: "''" }
      - name: established_date
        class: DateField
        kwargs: { null: true, blank: true }
    import_config:
      tier: 1
      bundle_path: reference/farms.csv
      required_headers: ["Farm Name", "Region", "Established"]
      column_map:
        name: "Farm Name"
        region: Region
        established_date: Established
      required_source_columns: ["name"]
      field_parsers:
        established_date: parse_date
      unique_on: ["name"]
      default_values:
        region: "Unknown"

  - suggested_model_name: ExampleField
    bundle_worksheet_title: Fields
    columns:
      - name: name
        class: CharField
        kwargs: { max_length: 200 }
      - name: farm
        class: ForeignKey
        kwargs: { to: "examples.ExampleFarm", on_delete: "models.CASCADE", related_name: "fields" }
      - name: acreage
        class: DecimalField
        kwargs: { max_digits: 8, decimal_places: 2, default: 0 }
      - name: is_active
        class: BooleanField
        kwargs: { default: true }
    import_config:
      tier: 2
      bundle_path: reference/fields.csv
      required_headers: ["Field Name", "Farm", "Acreage", "Active"]
      column_map:
        name: "Field Name"
        acreage: Acreage
        is_active: Active
      required_source_columns: ["name"]
      fk_lookup:
        farm: { model: "examples.ExampleFarm", on: name }
      unique_on: ["name"]

  - suggested_model_name: ExampleVariety
    bundle_worksheet_title: Varieties
    columns:
      - name: name
        class: CharField
        kwargs: { max_length: 200, unique: true }
      - name: crop
        class: ForeignKey
        kwargs: { to: "examples.ExampleCrop", on_delete: "models.CASCADE", related_name: "varieties" }
      - name: farm
        class: ForeignKey
        kwargs: { to: "examples.ExampleFarm", on_delete: "models.SET_NULL", null: true, blank: true, related_name: "varieties" }
      - name: seed_cost
        class: DecimalField
        kwargs: { max_digits: 8, decimal_places: 2, default: 0 }
      - name: full_description
        class: TextField
        kwargs: { blank: true, default: "''" }
    import_config:
      tier: 3
      bundle_path: reference/varieties.csv
      required_headers: ["Variety", "Crop", "Farm", "Seed Cost", "Short Notes", "Growing Season"]
      column_map:
        name: Variety
        seed_cost: "Seed Cost"
        full_description:
          - "Short Notes"
          - "Growing Season"
      field_transforms:
        full_description: "' — '.join(p for p in parts if p)"
      required_source_columns: ["name"]
      fk_lookup:
        crop: { model: "examples.ExampleCrop", on: name }
        farm: { model: "examples.ExampleFarm", on: name }
      unique_on: ["name"]
      default_values:
        full_description: ""