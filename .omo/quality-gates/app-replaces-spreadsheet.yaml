- id: 11
  name: All profiled tabs have a classification
  description: >
    Runs classification_summary from checkpoint and fails if any unknown
    tabs exist (indicating a profiled tab was not classified).
  command: >
    python manage.py shell -c '
    import yaml, json;
    from pathlib import Path;
    ckpt = yaml.safe_load(Path("checkpoint.yaml").read_text());
    from profiler.tools.tab_classifier import classification_summary, TabClassification;
    tcs = ckpt.get("interaction_contract", {}).get("tab_classifications", {});
    classifications = [
      TabClassification(tab_title=k, category=v["category"], confidence=v["confidence"], rationale=v.get("rationale", ""))
      for k, v in tcs.items()
    ];
    summary = classification_summary(classifications);
    print(f"Total: {summary[\"total\"]}, Unknown: {len(summary[\"unknown_tabs\"])}");
    assert len(summary["unknown_tabs"]) == 0, f"Unknown tabs: {summary[\"unknown_tabs\"]}";
    print("PASS: All tabs classified");
    '
  expected: classification_summary returns zero unknown tabs
  severity: blocking
- id: 12
  name: No UI config tabs were accidentally modeled
  description: >
    Checks that ui_config-classified tabs do not have entries in
    schema_contract.tables. UI config tabs should not be modeled as
    Django models.
  command: >
    python manage.py shell -c '
    import yaml;
    from pathlib import Path;
    ckpt = yaml.safe_load(Path("checkpoint.yaml").read_text());
    tcs = ckpt.get("interaction_contract", {}).get("tab_classifications", {});
    tables = ckpt.get("schema_contract", {}).get("tables", []);
    ui_config_titles = {k for k, v in tcs.items() if v.get("category") == "ui_config"};
    modeled_titles = {t.get("source_tab", "") for t in tables};
    accidental = ui_config_titles & modeled_titles;
    print(f"UI config tabs: {len(ui_config_titles)}, Modeled: {len(accidental)}");
    assert len(accidental) == 0, f"UI config tabs found in schema_contract: {accidental}";
    print("PASS: No UI config tabs modeled");
    '
  expected: No ui_config tabs appear in schema_contract.tables
  severity: blocking
