- id: 15
  name: Classification coverage improvement tracking
  description: >
    Informational — outputs classification coverage percentage for
    tracking over time.
  command: >
    python manage.py shell -c '
    import yaml;
    from pathlib import Path;
    ckpt = yaml.safe_load(Path("checkpoint.yaml").read_text());
    tcs = ckpt.get("interaction_contract", {}).get("tab_classifications", {});
    total = len(tcs);
    classified = sum(1 for v in tcs.values() if v.get("category") != "unknown");
    pct = round(classified / total * 100, 1) if total > 0 else 0.0;
    print(f"Classification coverage: {classified}/{total} = {pct}%");
    print("INFO: coverage tracking output");
    '
  expected: Prints coverage percentage (informational, always passes)
  severity: non-blocking
- id: 16
  name: "Database row coverage meets minimum threshold"
  description: >
    Compares total database records against total source spreadsheet rows.
    Requires the coverage ratio to exceed configurable minimum (default: 50%).
  command: >
    python manage.py shell -c '
    import json, yaml;
    from pathlib import Path;
    from django.apps import apps;
    total_db = sum(m.objects.count() for m in apps.get_app_config("core").get_models());
    structure_path = Path("build/bundle/structure.json");
    if structure_path.exists():
        structure = json.loads(structure_path.read_text());
        total_source = sum(t.get("total_rows", 0) for t in structure.get("tabs", []));
    else:
        ckpt = yaml.safe_load(Path("checkpoint.yaml").read_text());
        total_source = ckpt.get("interaction_contract", {}).get("source_row_count", 0);
    ratio = round(total_db / total_source * 100, 1) if total_source > 0 else 0;
    min_threshold = float("{{MIN_COVERAGE_PCT|50}}");
    print(f"Database records: {total_db}");
    print(f"Source rows: {total_source}");
    print(f"Coverage: {ratio}% (threshold: {min_threshold}%)");
    assert ratio >= min_threshold, (f"FAIL: Coverage {ratio}% below minimum {min_threshold}%");
    print("PASS: Data coverage meets minimum threshold");
    '
  expected: "Coverage ratio >= MIN_COVERAGE_PCT (default 50%)"
  severity: blocking
  config:
    min_coverage_pct: 50
- id: 17
  name: "Last import run had zero errors"
  description: >
    Reads most recent import summary JSON, verifies zero error rows.
  command: >
    python manage.py shell -c '
    import json, glob;
    from pathlib import Path;
    summaries = sorted(Path("build/imports/").glob("import-summary*.json"));
    assert len(summaries) > 0, "No import summary found — run import first";
    latest = max(summaries, key=lambda p: p.stat().st_mtime);
    summary = json.loads(latest.read_text());
    total_errors = summary.get("escalation_summary", {}).get("total_errors", -1);
    print(f"Import summary: {latest.name}");
    print(f"Total errors: {total_errors}");
    assert total_errors == 0, f"FAIL: {total_errors} import errors found";
    print("PASS: Last import had zero errors");
    '
  expected: "Zero errors in most recent import summary"
  severity: blocking
- id: 18
  name: "All foreign key references are valid"
  description: >
    Checks every FK field references an existing row. Orphans indicate import ordering issues.
  command: >
    python manage.py shell -c '
    from django.apps import apps;
    from django.db import connection;
    problematic = [];
    for model in apps.get_app_config("core").get_models():
        for field in model._meta.fields:
            if field.is_relation and field.many_to_one and field.remote_field:
                fk_field = field.column;
                related_table = field.remote_field.model._meta.db_table;
                sql = f"""
                    SELECT COUNT(*) FROM {model._meta.db_table} t
                    LEFT JOIN {related_table} r ON t.{fk_field}_id = r.id
                    WHERE t.{fk_field}_id IS NOT NULL AND r.id IS NULL
                """;
                with connection.cursor() as cursor:
                    cursor.execute(sql);
                    orphan_count = cursor.fetchone()[0];
                    if orphan_count > 0:
                        problematic.append(f"{model.__name__}.{field.name}: {orphan_count} orphans");
    if problematic:
        for p in problematic:
            print(f"ORPHAN: {p}");
        assert False, f"FAIL: {len(problematic)} FK fields have orphaned references";
    else:
        print("PASS: All FK references are valid");
    '
  expected: "Zero orphaned FK references across all models"
  severity: blocking
