[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-workbench"
version = "0.4.2"
description = "Reusable profiler and importer chassis for tabular migrations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Eric Allatta", email = "ericallatta@gmail.com" },
]
keywords = [
  "django",
  "migration",
  "tabular",
  "workbook",
  "import",
  "profiler",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "Django>=5.0,<6.0",
  "gunicorn>=22.0",
  "whitenoise>=6.6,<7",
  "google-api-python-client",
  "google-auth",
  "google-auth-oauthlib",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.scripts]
wb = "deployment.wb_cli:main"

[project.urls]
Homepage = "https://github.com/MrAllatta/migration-workbench"
Repository = "https://github.com/MrAllatta/migration-workbench"
Issues = "https://github.com/MrAllatta/migration-workbench/issues"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-django",
  "ruff",
  "black",
  "build>=1.2",
  "twine>=5.0",
  "interrogate>=1.5",
]
release = [
  "build>=1.2",
  "twine>=5.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["migration_workbench*", "connectors*", "profiler*", "importer*", "examples*", "workbook*", "deployment*", "workbench*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "migration_workbench.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

# TODO: Fix remaining lint issues in a follow-up and remove these ignores.
[tool.ruff.lint]
ignore = [
    "E402",  # module-level import not at top — common in Django management commands with sys.path manipulation
    "E731",  # lambda assignment — used for concise default callbacks
    "E741",  # ambiguous variable name — TODO: rename `l` in test_admin_generator.py
    "F821",  # undefined name — TODO: fix missing imports in scripts/ and workbook/
    "F841",  # unused variable — TODO: remove or prefix with _ in tests and import_generator
]

[tool.interrogate]
fail-under = 80
exclude = ["migrations", "*tests.py", "*test_*.py", "*_tests.py", "*__init__.py", "setup.py", "*conftest.py"]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
verbose = 1
