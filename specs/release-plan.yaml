# mirror — docs/roadmap.md is canonical
# Bigpowers adapter: maps engine version milestones as epics so
# bigpowers skills (build-epic, verify-work, release-branch) can
# discover what's in flight and what's next.

release:
  next_version: "0.9.7"
  last_tag: "v0.9.6"
  last_publish: null            # PyPI blocked until 1.0.0; releases are local git tags

epics:
