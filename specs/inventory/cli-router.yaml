    target_module: deployment/commands/manifest.py
    status: extracted
  - id: e03s03
    target_module: deployment/commands/contract.py
    status: extracted
  - id: e03s04
    target_modules:
      - deployment/commands/generate.py
      - deployment/commands/vertical.py
